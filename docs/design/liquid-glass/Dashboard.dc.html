<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro", system-ui, sans-serif; }
    a { color: #5CE65C; } a:hover { color: #2E8F2E; }
    .card {
      background: rgba(26, 28, 24, 0.72);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      backdrop-filter: blur(18px) saturate(1.3);
      border: 1px solid rgba(237, 239, 232, 0.10);
      border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .glass {
      background: rgba(20, 22, 19, 0.52);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid rgba(237, 239, 232, 0.16);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .label { font-size: 13px; color: #9AA096; }
    .bar { height: 8px; border-radius: 4px; background: #23261F; overflow: hidden; }
    .fill { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #2E8F2E, #5CE65C); }
  </style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; background: #0E0F0D; color: #EDEFE8; border-radius: 44px; overflow: hidden; position: relative;">

  <!-- faint wall of tiles behind the glass, so the blur has something to bite -->
  <div dir="ltr" style="position: absolute; inset: 0; opacity: 0.35; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; align-content: start;">
    <div style="aspect-ratio: 1; background: #D8CDB4;"></div>
    <div style="aspect-ratio: 1; background: #4A4640;"></div>
    <div style="aspect-ratio: 1; background: #C9BEA5;"></div>
    <div style="aspect-ratio: 1; background: #8F5B3A;"></div>
    <div style="aspect-ratio: 1; background: #E4DCC8;"></div>
    <div style="aspect-ratio: 1; background: #B9AE96;"></div>
    <div style="aspect-ratio: 1; background: #3E3B36;"></div>
    <div style="aspect-ratio: 1; background: #CEC3AA;"></div>
    <div style="aspect-ratio: 1; background: #57524B;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: linear-gradient(rgba(14, 15, 13, 0.55), rgba(14, 15, 13, 0.92) 45%, #0E0F0D 70%);"></div>

  <div style="position: absolute; top: 64px; right: 20px; text-align: right;">
    <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.3px; color: #fff;">האוסף</div>
    <div style="font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.85);">דשבורד</div>
  </div>
  <div class="glass" style="position: absolute; top: 64px; left: 20px; width: 42px; height: 42px; border-radius: 21px; display: flex; align-items: center; justify-content: center;">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#5CE65C" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="15" x2="3" y2="9"></line><line x1="9" y1="15" x2="9" y2="3"></line><line x1="15" y1="15" x2="15" y2="7"></line></svg>
  </div>

  <div style="position: absolute; top: 140px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 12px;">

    <div style="display: flex; gap: 12px;">
      <div class="card" style="flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 26px; font-weight: 700;"><span class="mono">214</span></div>
        <div class="label">פריטים, <span class="mono">9</span> נוספו החודש</div>
      </div>
      <div class="card" style="flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
        <div dir="ltr" class="mono" style="font-size: 26px; font-weight: 700; color: #5CE65C; text-align: right; text-shadow: 0 0 18px rgba(92, 230, 92, 0.35);">₪68.4k</div>
        <div dir="ltr" class="label" style="text-align: right;">₪51k עד ₪89k</div>
      </div>
    </div>

    <div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <span class="label">לפי יצרן</span>
      <div style="display: flex; align-items: center; gap: 10px;"><span dir="ltr" style="width: 92px; font-size: 14px; text-align: right;">Apple</span><div class="bar" style="flex: 1;"><div class="fill" style="width: 88%;"></div></div><span class="mono label" style="width: 26px; text-align: center;">96</span></div>
      <div style="display: flex; align-items: center; gap: 10px;"><span dir="ltr" style="width: 92px; font-size: 14px; text-align: right;">Commodore</span><div class="bar" style="flex: 1;"><div class="fill" style="width: 52%;"></div></div><span class="mono label" style="width: 26px; text-align: center;">57</span></div>
      <div style="display: flex; align-items: center; gap: 10px;"><span dir="ltr" style="width: 92px; font-size: 14px; text-align: right;">Atari</span><div class="bar" style="flex: 1;"><div class="fill" style="width: 30%;"></div></div><span class="mono label" style="width: 26px; text-align: center;">33</span></div>
      <div style="display: flex; align-items: center; gap: 10px;"><span dir="ltr" style="width: 92px; font-size: 14px; text-align: right;">Nintendo</span><div class="bar" style="flex: 1;"><div class="fill" style="width: 17%;"></div></div><span class="mono label" style="width: 26px; text-align: center;">19</span></div>
    </div>

    <div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <span class="label">מצב תפקודי</span>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1;"><div style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #5CE65C;"></span><span class="mono" style="font-size: 17px; font-weight: 700;">161</span></div><div class="label">עובד</div></div>
        <div style="flex: 1;"><div style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F5A524;"></span><span class="mono" style="font-size: 17px; font-weight: 700;">12</span></div><div class="label">חלקית</div></div>
        <div style="flex: 1;"><div style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #E0563F;"></span><span class="mono" style="font-size: 17px; font-weight: 700;">9</span></div><div class="label">לא עובד</div></div>
        <div style="flex: 1;"><div style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #7A7F76;"></span><span class="mono" style="font-size: 17px; font-weight: 700;">32</span></div><div class="label">לא נבדק</div></div>
      </div>
    </div>

    <div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <span class="label">דורש טיפול</span>
      <div style="font-size: 14px;"><span class="mono">3</span> ללא מיקום, <span class="mono">2</span> כפילויות, <span class="mono">2</span> שווי ישן</div>
    </div>

    <div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <span class="label">נוספו לאחרונה</span>
      <div style="display: flex; gap: 8px;">
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #D8CDB4;"></div>
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #4A4640;"></div>
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #8F5B3A;"></div>
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #C9BEA5;"></div>
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #57524B;"></div>
      </div>
    </div>
  </div>

  <div class="glass" style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); border-radius: 32px; display: flex; gap: 6px; padding: 8px 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 14px; border-radius: 22px; background: rgba(92, 230, 92, 0.18);">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5CE65C" stroke-width="1.7"><rect x="2.5" y="2.5" width="6" height="6" rx="1.5"></rect><rect x="11.5" y="2.5" width="6" height="6" rx="1.5"></rect><rect x="2.5" y="11.5" width="6" height="6" rx="1.5"></rect><rect x="11.5" y="11.5" width="6" height="6" rx="1.5"></rect></svg>
      <span style="font-size: 10px; color: #5CE65C; font-weight: 600;">אוסף</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 14px; border-radius: 22px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.7"><rect x="2.5" y="4.5" width="12" height="10" rx="2"></rect><path d="M5.5 4.5v-2h12v10h-2"></path></svg>
      <span style="font-size: 10px; color: rgba(255, 255, 255, 0.75);">גלריות</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 14px; border-radius: 22px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.7"><path d="M10 16.5S3 12.2 3 7.6A3.8 3.8 0 0 1 10 5.5a3.8 3.8 0 0 1 7 2.1c0 4.6-7 8.9-7 8.9Z"></path></svg>
      <span style="font-size: 10px; color: rgba(255, 255, 255, 0.75);">מועדפים</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 14px; border-radius: 22px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.7"><circle cx="10" cy="6.5" r="3.2"></circle><path d="M3.5 17c.8-3.4 3.4-5 6.5-5s5.7 1.6 6.5 5"></path></svg>
      <span style="font-size: 10px; color: rgba(255, 255, 255, 0.75);">פרופיל</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
